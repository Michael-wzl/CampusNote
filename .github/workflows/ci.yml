# Runs on every pull request and on main: lint, every test, and the SQL check suite against a
# MySQL 8.4 service. Branch protection on main requires this job ("ci") to pass.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-paths:
    name: Windows reset-path and source-package checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: SQL parser, reset order and source packaging
        run: node --test test/core/reset.test.js test/core/package-source.test.js

  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: campus_notes
      DB_NAME_TEST: campus_notes_test
      SESSION_SECRET: ci-only-secret
      MYSQL: mysql -h 127.0.0.1 -P 3306 -uroot -proot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Install MySQL client
        run: sudo apt-get update -qq && sudo apt-get install -y default-mysql-client
      - name: SQL checks
        run: npm run check:sql
      - name: Rebuild and smoke-test the exported source ZIP
        env:
          NODE_ENV: development
          DB_NAME: campus_source_verify
          DB_NAME_TEST: campus_source_verify_test
        run: |
          npm run package:source -- --out "$RUNNER_TEMP/Group_8_code.zip"
          mkdir "$RUNNER_TEMP/campus-source-rebuild"
          unzip -q "$RUNNER_TEMP/Group_8_code.zip" -d "$RUNNER_TEMP/campus-source-rebuild"
          cd "$RUNNER_TEMP/campus-source-rebuild/CampusNote"
          npm ci
          npm run setup
          npm run db:reset
          node <<'NODE'
          const assert = require('node:assert/strict');
          const request = require('supertest');
          const cheerio = require('cheerio');
          const { createApp } = require('./app');
          const db = require('./core/db');
          const { startTestServer, stopTestServer } = require('./test/http-server');
          (async () => {
            const server = await startTestServer(createApp());
            try {
              const agent = request.agent(server);
              const login = await agent.get('/auth/login').expect(200);
              const csrf = cheerio.load(login.text)('meta[name="csrf-token"]').attr('content');
              assert.ok(csrf);
              await agent.post('/auth/login').type('form').send({
                _csrf: csrf, email: 'newbie@connect.hku.hk', password: 'campus123',
              }).expect(303);
              for (const url of ['/feed', '/feed?tab=hot', '/search?q=book', '/me', '/events'])
                await agent.get(url).expect(200);
              assert.equal((await db.q.one('SELECT COUNT(*) AS n FROM users')).n, 8);
              console.log('Exported-source clean rebuild and login smoke passed');
            } finally {
              await stopTestServer(server);
              await db.close();
            }
          })().catch((error) => { console.error(error); process.exitCode = 1; });
          NODE
