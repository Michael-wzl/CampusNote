<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img"><title>Accounts, roles and event tickets</title><desc>A university domain is multivalued; roles are a partial, disjoint specialization. Tickets are a relationship set. Double ellipse = multivalued; dashed ellipse = derived. Tickets map to the user/event key plus relationship attributes.</desc><defs><marker id="one" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#202020" stroke-width="2.4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g fill="none" stroke="#202020" stroke-width="2.4" stroke-linejoin="round"><polyline points="805,217 635,217"/><polyline points="805,223 635,223"/><polyline points="465,220 345,220" marker-end="url(#one)"/><polyline points="250,185 250,156"/><polyline points="225,255 200,349"/><polyline points="995,195 1100,165"/><polyline points="900,255 900,355"/><polyline points="845,465 620,555"/><polyline points="955,465 1100,555"/><polyline points="620,625 620,689"/><polyline points="1450,545 1450,240 995,240" marker-end="url(#one)"/><polyline points="995,967 1450,632"/><polyline points="995,973 1450,638"/><polyline points="870,255 870,300 430,300 430,850 500,925"/><polyline points="805,970 585,970"/><polyline points="355,850 415,970"/><polyline points="355,1060 415,970"/><polyline points="500,1015 500,1079"/><polyline points="900,935 900,846"/><polyline points="995,995 1040,1065"/></g><g font-family="Arial, Helvetica, sans-serif" fill="white" stroke="#202020" stroke-width="2.4"><rect x="155" y="185" width="190" height="70"/><text stroke="none" fill="#202020" x="250" y="228" font-size="24" text-anchor="middle" font-weight="600">university</text><rect x="805" y="185" width="190" height="70"/><text stroke="none" fill="#202020" x="900" y="228" font-size="24" text-anchor="middle" font-weight="600">user</text><rect x="525" y="555" width="190" height="70"/><text stroke="none" fill="#202020" x="620" y="598" font-size="24" text-anchor="middle" font-weight="600">organization</text><rect x="1005" y="555" width="190" height="70"/><text stroke="none" fill="#202020" x="1100" y="598" font-size="24" text-anchor="middle" font-weight="600">admin</text><rect x="805" y="935" width="190" height="70"/><text stroke="none" fill="#202020" x="900" y="978" font-size="24" text-anchor="middle" font-weight="600">event</text><polygon points="465,220 550,175 635,220 550,265"/><text stroke="none" fill="#202020" x="550" y="227" font-size="21" text-anchor="middle" font-weight="400">studies at</text><ellipse cx="250" cy="125" rx="130" ry="31"/><text stroke="none" fill="#202020" x="250" y="132" font-size="21" text-anchor="middle" font-weight="400">university_id</text><path d="M 178.5 137 h 143" fill="none"/><ellipse cx="200" cy="380" rx="105" ry="31"/><ellipse cx="200" cy="380" rx="99" ry="25"/><text stroke="none" fill="#202020" x="200" y="387" font-size="21" text-anchor="middle" font-weight="400">domain</text><ellipse cx="1190" cy="150" rx="105" ry="31"/><text stroke="none" fill="#202020" x="1190" y="157" font-size="21" text-anchor="middle" font-weight="400">user_id</text><path d="M 1151.5 162 h 77" fill="none"/><polygon points="900,355 820,465 980,465"/><text stroke="none" fill="#202020" x="900" y="425" font-size="24" text-anchor="middle" font-weight="600">ISA</text><text stroke="none" fill="#202020" x="1120" y="395" font-size="21" text-anchor="middle" font-weight="600">Partial, disjoint</text><text stroke="none" fill="#202020" x="1190" y="433" font-size="19" text-anchor="middle" font-weight="400">A student is in neither subtype.</text><ellipse cx="620" cy="720" rx="125" ry="31"/><text stroke="none" fill="#202020" x="620" y="727" font-size="21" text-anchor="middle" font-weight="400">display_name</text><polygon points="1365,590 1450,545 1535,590 1450,635"/><text stroke="none" fill="#202020" x="1450" y="597" font-size="21" text-anchor="middle" font-weight="400">organizes</text><text stroke="none" fill="#202020" x="1530" y="760" font-size="19" text-anchor="middle" font-weight="400">Organizer is an organization or admin.</text><text stroke="none" fill="#202020" x="1530" y="791" font-size="19" text-anchor="middle" font-weight="400">Role check in application; FK to users.</text><polygon points="415,970 500,925 585,970 500,1015"/><text stroke="none" fill="#202020" x="500" y="977" font-size="21" text-anchor="middle" font-weight="400">holds ticket</text><ellipse cx="240" cy="850" rx="115" ry="31"/><text stroke="none" fill="#202020" x="240" y="857" font-size="21" text-anchor="middle" font-weight="400">ticket_code</text><ellipse cx="240" cy="1060" rx="115" ry="31"/><text stroke="none" fill="#202020" x="240" y="1067" font-size="21" text-anchor="middle" font-weight="400">booked_at</text><ellipse cx="500" cy="1110" rx="135" ry="31"/><text stroke="none" fill="#202020" x="500" y="1117" font-size="21" text-anchor="middle" font-weight="400">checked_in_at</text><ellipse cx="900" cy="815" rx="105" ry="31"/><text stroke="none" fill="#202020" x="900" y="822" font-size="21" text-anchor="middle" font-weight="400">event_id</text><path d="M 856.0 827 h 88" fill="none"/><ellipse cx="1110" cy="1090" rx="120" ry="31" stroke-dasharray="9 6"/><text stroke="none" fill="#202020" x="1110" y="1097" font-size="21" text-anchor="middle" font-weight="400">tickets_left</text><text stroke="none" fill="#202020" x="1410" y="1115" font-size="18" text-anchor="middle" font-weight="400">Derived inventory is deliberately stored</text><text stroke="none" fill="#202020" x="1410" y="1142" font-size="18" text-anchor="middle" font-weight="400">for the atomic booking transaction.</text><text stroke="none" fill="#202020" x="45" y="57" font-size="32" text-anchor="start" font-weight="600">Accounts, roles and event tickets</text><text stroke="none" fill="#202020" x="45" y="92" font-size="20" text-anchor="start" font-weight="400">A university domain is multivalued; roles are a partial, disjoint specialization. Tickets are a relationship set.</text><path d="M 45 1175 H 1755"/><text stroke="none" fill="#202020" x="45" y="1207" font-size="19" text-anchor="start" font-weight="400">Chen notation: rectangle = entity; diamond = relationship; ellipse = attribute; underline = key.</text><text stroke="none" fill="#202020" x="45" y="1236" font-size="19" text-anchor="start" font-weight="400">Arrow at entity = at most one; double line = total participation; double rectangle/diamond = weak identification.</text><text stroke="none" fill="#202020" x="45" y="1263" font-size="18" text-anchor="start" font-weight="400">Double ellipse = multivalued; dashed ellipse = derived. Tickets map to the user/event key plus relationship attributes.</text></g></svg>