<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img"><title>Forum and per-post identities</title><desc>Selected conceptual model: authorship, aliases, comments, topics and ordered images. Dashed underline = weak entity partial key. post_image is identified by (post_id, position). Selected attributes only.</desc><defs><marker id="one" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#202020" stroke-width="2.4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g fill="none" stroke="#202020" stroke-width="2.4" stroke-linejoin="round"><polyline points="895,170 935,170"/><polyline points="895,615 970,714"/><polyline points="250,625 250,709"/><polyline points="1350,625 1350,729"/><polyline points="895,920 935,920"/><polyline points="800,305 800,205" marker-end="url(#one)"/><polyline points="797,555 797,395"/><polyline points="803,555 803,395"/><polyline points="705,170 500,305"/><polyline points="730,555 500,395"/><polyline points="365,285 415,350"/><polyline points="365,405 415,350"/><polyline points="345,587 390,587"/><polyline points="345,593 390,593"/><polyline points="560,590 705,590" marker-end="url(#one)"/><polyline points="995,590 895,590" marker-end="url(#one)"/><polyline points="1255,587 1165,587"/><polyline points="1255,593 1165,593"/><polyline points="1245,330 895,190" marker-end="url(#one)"/><polyline points="1347,555 1347,364"/><polyline points="1353,555 1353,364"/><polyline points="1445,565 1550,565 1550,405"/><polyline points="1635,360 1700,360 1700,610 1445,610" marker-end="url(#one)"/><polyline points="797,625 797,755"/><polyline points="803,625 803,755"/><polyline points="800,845 800,885" marker-end="url(#one)"/></g><g font-family="Arial, Helvetica, sans-serif" fill="white" stroke="#202020" stroke-width="2.4"><rect x="705" y="135" width="190" height="70"/><text stroke="none" fill="#202020" x="800" y="178" font-size="24" text-anchor="middle" font-weight="600">user</text><rect x="705" y="555" width="190" height="70"/><text stroke="none" fill="#202020" x="800" y="598" font-size="24" text-anchor="middle" font-weight="600">post</text><rect x="155" y="555" width="190" height="70"/><rect x="161" y="561" width="178" height="58"/><text stroke="none" fill="#202020" x="250" y="598" font-size="24" text-anchor="middle" font-weight="600">post_image</text><rect x="1255" y="555" width="190" height="70"/><text stroke="none" fill="#202020" x="1350" y="598" font-size="24" text-anchor="middle" font-weight="600">comment</text><rect x="705" y="885" width="190" height="70"/><text stroke="none" fill="#202020" x="800" y="928" font-size="24" text-anchor="middle" font-weight="600">topic</text><ellipse cx="1040" cy="170" rx="105" ry="31"/><text stroke="none" fill="#202020" x="1040" y="177" font-size="21" text-anchor="middle" font-weight="400">user_id</text><path d="M 1001.5 182 h 77" fill="none"/><ellipse cx="1030" cy="740" rx="105" ry="31"/><text stroke="none" fill="#202020" x="1030" y="747" font-size="21" text-anchor="middle" font-weight="400">post_id</text><path d="M 991.5 752 h 77" fill="none"/><ellipse cx="250" cy="740" rx="105" ry="31"/><text stroke="none" fill="#202020" x="250" y="747" font-size="21" text-anchor="middle" font-weight="400">position</text><path d="M 206.0 752 h 88" fill="none" stroke-dasharray="5 4"/><ellipse cx="1350" cy="760" rx="115" ry="31"/><text stroke="none" fill="#202020" x="1350" y="767" font-size="21" text-anchor="middle" font-weight="400">comment_id</text><path d="M 1295.0 772 h 110" fill="none"/><ellipse cx="1040" cy="920" rx="105" ry="31"/><text stroke="none" fill="#202020" x="1040" y="927" font-size="21" text-anchor="middle" font-weight="400">topic_id</text><path d="M 996.0 932 h 88" fill="none"/><polygon points="715,350 800,305 885,350 800,395"/><text stroke="none" fill="#202020" x="800" y="357" font-size="21" text-anchor="middle" font-weight="400">writes</text><polygon points="415,350 500,305 585,350 500,395"/><text stroke="none" fill="#202020" x="500" y="357" font-size="21" text-anchor="middle" font-weight="400">participates</text><ellipse cx="260" cy="285" rx="105" ry="31"/><text stroke="none" fill="#202020" x="260" y="292" font-size="21" text-anchor="middle" font-weight="400">alias_no</text><ellipse cx="260" cy="405" rx="105" ry="31"/><text stroke="none" fill="#202020" x="260" y="412" font-size="21" text-anchor="middle" font-weight="400">joined_at</text><polygon points="390,590 475,545 560,590 475,635"/><polygon points="400,590 475,552 550,590 475,628"/><text stroke="none" fill="#202020" x="475" y="597" font-size="21" text-anchor="middle" font-weight="400">has image</text><polygon points="995,590 1080,545 1165,590 1080,635"/><text stroke="none" fill="#202020" x="1080" y="597" font-size="21" text-anchor="middle" font-weight="400">on</text><polygon points="1245,330 1330,285 1415,330 1330,375"/><text stroke="none" fill="#202020" x="1330" y="337" font-size="21" text-anchor="middle" font-weight="400">authored</text><polygon points="1465,360 1550,315 1635,360 1550,405"/><text stroke="none" fill="#202020" x="1550" y="367" font-size="21" text-anchor="middle" font-weight="400">replies to</text><text stroke="none" fill="#202020" x="1510" y="540" font-size="19" text-anchor="middle" font-weight="400">reply</text><text stroke="none" fill="#202020" x="1610" y="642" font-size="19" text-anchor="middle" font-weight="400">original</text><polygon points="715,800 800,755 885,800 800,845"/><text stroke="none" fill="#202020" x="800" y="807" font-size="21" text-anchor="middle" font-weight="400">filed under</text><text stroke="none" fill="#202020" x="1040" y="995" font-size="19" text-anchor="middle" font-weight="400">A comment's author must participate in that same post: composite FK.</text><text stroke="none" fill="#202020" x="45" y="57" font-size="32" text-anchor="start" font-weight="600">Forum and per-post identities</text><text stroke="none" fill="#202020" x="45" y="92" font-size="20" text-anchor="start" font-weight="400">Selected conceptual model: authorship, aliases, comments, topics and ordered images.</text><path d="M 45 1055 H 1755"/><text stroke="none" fill="#202020" x="45" y="1087" font-size="19" text-anchor="start" font-weight="400">Chen notation: rectangle = entity; diamond = relationship; ellipse = attribute; underline = key.</text><text stroke="none" fill="#202020" x="45" y="1116" font-size="19" text-anchor="start" font-weight="400">Arrow at entity = at most one; double line = total participation; double rectangle/diamond = weak identification.</text><text stroke="none" fill="#202020" x="45" y="1143" font-size="18" text-anchor="start" font-weight="400">Dashed underline = weak entity partial key. post_image is identified by (post_id, position). Selected attributes only.</text></g></svg>