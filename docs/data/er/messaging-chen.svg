<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img"><title>Private conversation contexts</title><desc>One conversation has one starter and one recipient; a post context is optional. Selected attributes only. Starter/recipient are the two role projections of 'between'. Anonymity is a display rule, not an absent user FK.</desc><defs><marker id="one" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#202020" stroke-width="2.4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g fill="none" stroke="#202020" stroke-width="2.4" stroke-linejoin="round"><polyline points="695,250 395,250" marker-end="url(#one)"/><polyline points="1247,412 1247,247 862,247"/><polyline points="1253,418 1253,253 868,253"/><polyline points="695,450 395,270" marker-end="url(#one)"/><polyline points="1155,447 865,447"/><polyline points="1155,453 865,453"/><polyline points="300,475 300,285" marker-end="url(#one)"/><polyline points="297,765 297,565"/><polyline points="303,765 303,565"/><polyline points="395,797 695,797"/><polyline points="395,803 695,803"/><polyline points="865,800 1250,485" marker-end="url(#one)"/><polyline points="1345,470 1500,605"/><polyline points="1500,695 1500,865" marker-end="url(#one)"/><polyline points="205,270 120,374"/><polyline points="1345,430 1365,430"/><polyline points="300,835 300,909"/><polyline points="1500,935 1500,999"/></g><g font-family="Arial, Helvetica, sans-serif" fill="white" stroke="#202020" stroke-width="2.4"><rect x="205" y="215" width="190" height="70"/><text stroke="none" fill="#202020" x="300" y="258" font-size="24" text-anchor="middle" font-weight="600">user</text><rect x="1155" y="415" width="190" height="70"/><text stroke="none" fill="#202020" x="1250" y="458" font-size="24" text-anchor="middle" font-weight="600">conversation</text><rect x="205" y="765" width="190" height="70"/><text stroke="none" fill="#202020" x="300" y="808" font-size="24" text-anchor="middle" font-weight="600">message</text><rect x="1405" y="865" width="190" height="70"/><text stroke="none" fill="#202020" x="1500" y="908" font-size="24" text-anchor="middle" font-weight="600">post</text><polygon points="695,250 780,205 865,250 780,295"/><text stroke="none" fill="#202020" x="780" y="257" font-size="21" text-anchor="middle" font-weight="400">starter</text><polygon points="695,450 780,405 865,450 780,495"/><text stroke="none" fill="#202020" x="780" y="457" font-size="21" text-anchor="middle" font-weight="400">recipient</text><text stroke="none" fill="#202020" x="1510" y="330" font-size="19" text-anchor="middle" font-weight="400">starter_id != recipient_id</text><polygon points="215,520 300,475 385,520 300,565"/><text stroke="none" fill="#202020" x="300" y="527" font-size="21" text-anchor="middle" font-weight="400">sent</text><polygon points="695,800 780,755 865,800 780,845"/><text stroke="none" fill="#202020" x="780" y="807" font-size="21" text-anchor="middle" font-weight="400">in</text><polygon points="1415,650 1500,605 1585,650 1500,695"/><text stroke="none" fill="#202020" x="1500" y="657" font-size="21" text-anchor="middle" font-weight="400">started from</text><text stroke="none" fill="#202020" x="1670" y="760" font-size="19" text-anchor="middle" font-weight="400">optional</text><text stroke="none" fill="#202020" x="1670" y="788" font-size="19" text-anchor="middle" font-weight="400">post context</text><ellipse cx="120" cy="405" rx="100" ry="31"/><text stroke="none" fill="#202020" x="120" y="412" font-size="21" text-anchor="middle" font-weight="400">user_id</text><path d="M 81.5 417 h 77" fill="none"/><ellipse cx="1510" cy="430" rx="145" ry="31"/><text stroke="none" fill="#202020" x="1510" y="437" font-size="21" text-anchor="middle" font-weight="400">conversation_id</text><path d="M 1427.5 442 h 165" fill="none"/><ellipse cx="300" cy="940" rx="115" ry="31"/><text stroke="none" fill="#202020" x="300" y="947" font-size="21" text-anchor="middle" font-weight="400">message_id</text><path d="M 245.0 952 h 110" fill="none"/><ellipse cx="1500" cy="1030" rx="105" ry="31"/><text stroke="none" fill="#202020" x="1500" y="1037" font-size="21" text-anchor="middle" font-weight="400">post_id</text><path d="M 1461.5 1042 h 77" fill="none"/><text stroke="none" fill="#202020" x="640" y="625" font-size="19" text-anchor="middle" font-weight="400">Post context: Host / alias / Visitor.</text><text stroke="none" fill="#202020" x="640" y="657" font-size="19" text-anchor="middle" font-weight="400">Public context: handle may be shown.</text><text stroke="none" fill="#202020" x="640" y="689" font-size="19" text-anchor="middle" font-weight="400">Sender must be a conversation member (trigger).</text><text stroke="none" fill="#202020" x="45" y="57" font-size="32" text-anchor="start" font-weight="600">Private conversation contexts</text><text stroke="none" fill="#202020" x="45" y="92" font-size="20" text-anchor="start" font-weight="400">One conversation has one starter and one recipient; a post context is optional. Selected attributes only.</text><path d="M 45 1075 H 1755"/><text stroke="none" fill="#202020" x="45" y="1107" font-size="19" text-anchor="start" font-weight="400">Chen notation: rectangle = entity; diamond = relationship; ellipse = attribute; underline = key.</text><text stroke="none" fill="#202020" x="45" y="1136" font-size="19" text-anchor="start" font-weight="400">Arrow at entity = at most one; double line = total participation; double rectangle/diamond = weak identification.</text><text stroke="none" fill="#202020" x="45" y="1163" font-size="18" text-anchor="start" font-weight="400">Starter/recipient are the two role projections of 'between'. Anonymity is a display rule, not an absent user FK.</text></g></svg>